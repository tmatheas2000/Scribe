@if (loggedIn) {
  <div class="row mt-5">
    <div class="col">
      <textarea rows="2" placeholder="Your comment here ..." [(ngModel)]="comment"></textarea>
    </div>
  </div>
}

@if (loggedIn) {
  <div class="row">
    <div class="col">
      <div class="pull-right">
        <button class="btn btn-primary" (click)="postComment()">Post</button>
      </div>
    </div>
  </div>
}

@if (!loggedIn) {
  <div class="alert alert-primary">
    Please login to post a comment.
  </div>
}

<h4>Comments({{comments.length}})</h4>

@for (comment of comments; track comment) {
  <div class="row mt-3">
    <div class="col">
      <div class="card">
        <div class="card-header">
          {{comment.ownerName}} <i>commented on </i>{{
          comment.created.toDate() | date: 'MMM dd, yyyy h:mm a'
          }}
        </div>
        <div class="card-body">
          <div class="card-text">
            {{comment.text}}
          </div>
        </div>
      </div>
    </div>
  </div>
}
